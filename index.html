<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>大连，真是一次美妙的旅行</title>
  <meta name="description" content="大连，真是一次美妙的旅行 — 浏览器里播放的动效短片，16:9 与 9:16 两个版本。">
  <script>
    /* Pick the cut that fits the screen before anything heavy loads:
       a phone held upright → the portrait cut (./m/), anything wide → the 16:9 cut (./d/).
       Override by hand: ?desktop (16:9) or ?mobile (9:16); the rest of the query string is passed on. */
    (function () {
      const q = location.search;
      const keep = (q.replace(/[?&](desktop|mobile)\b/g, '').replace(/^&/, '?') || '');
      if (/[?&]desktop\b/.test(q)) { location.replace('./d/' + keep); return; }
      if (/[?&]mobile\b/.test(q)) { location.replace('./m/' + keep); return; }
      const portrait = window.matchMedia('(max-aspect-ratio: 1/1)').matches;
      const touch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
      const small = Math.min(screen.width, screen.height) <= 600;
      location.replace((portrait && (touch || small)) ? './m/' + keep : './d/' + keep);
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; background: #071a26; color: #eef6fb; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
      font-family: system-ui, sans-serif; text-align: center; padding: 24px;
    }
    /* the one horizon line — with a system font here, because this page is a doorway, not the piece itself */
    .line { width: min(560px, 80vw); height: 3px;
      background: linear-gradient(90deg, rgba(69,214,200,0), #45d6c8, rgba(238,246,251,.9), #45d6c8, rgba(69,214,200,0)); }
    h1 { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: .02em; }
    p { margin: 0; color: #7e9aab; font-size: 15px; line-height: 1.7; }
    nav { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
    a { color: #ffb454; text-decoration: none; border: 1px solid rgba(255,180,84,.45);
        border-radius: 999px; padding: 12px 22px; font-size: 15px; }
    a:hover { background: rgba(255,180,84,.12); }
  </style>
</head>
<body>
  <h1>大连，真是一次美妙的旅行</h1>
  <div class="line"></div>
  <p>正在按屏幕比例选择版本…<br>手机竖屏会自动打开 9:16 竖版；横屏或电脑打开 16:9 版。</p>
  <nav>
    <a href="./d/">16:9 · 电脑 / YouTube</a>
    <a href="./m/">9:16 · 手机竖屏 / Shorts</a>
  </nav>
</body>
</html>
